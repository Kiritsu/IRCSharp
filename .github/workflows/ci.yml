name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore IRCSharp.sln

      - name: Build
        run: dotnet build IRCSharp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test IRCSharp.sln --no-build --configuration Release --verbosity normal
